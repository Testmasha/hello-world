name: Sync Markdown to Confluence
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert and publish Markdown
        uses: markdown-confluence/publish-action@v1  # community action
        with:
          confluenceBaseUrl: ${{ secrets.CONFLUENCE_BASE_URL }}
          confluenceUser: ${{ secrets.CONFLUENCE_USER }}
          confluenceToken: ${{ secrets.CONFLUENCE_API_TOKEN }}
          spaceKey: ${{ secrets.CONFLUENCE_SPACE_KEY }}
          parentPageId: ${{ secrets.CONFLUENCE_PARENT_PAGE_ID }}
          sourcePath: docs/
